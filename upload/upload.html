<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Upload — FitFind</title>
    <link rel="stylesheet" href="upload.css" />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a class="logo" href="../index/index.html"><span>♡</span> FitFind</a>
        <div class="nav-links">
          <a href="../index/index.html">Home</a
          ><a href="../how-it-works/how-it-works.html">How It Works</a
          ><a class="active" href="../upload/upload.html">Find a Look</a
          ><a href="../my-looks/my-looks.html">My Looks</a>
        </div>
        <div class="nav-right">
          <a href="../profile/profile.html">Profile</a>
        </div>
      </nav>
      <div class="page-head">
        <h1>Upload your piece</h1>
        <p>Give us one item. We'll help you build the rest.</p>
      </div>
      <div class="upload-box">
        <div id="uploadText">
          <div class="upload-icon">↑</div>
          <h3>Upload an image</h3>
          <p>JPG, PNG or WEBP · up to 5 MB</p>
          <label class="btn" for="file">Choose File</label
          ><input id="file" type="file" accept="image/*" hidden />
        </div>
      </div>
      <div class="examples">
        <div class="mini">
          <img
            src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=300&q=80"
          />
        </div>
        <div class="mini">
          <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300&q=80"
          />
        </div>
        <div class="mini">
          <img
            src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=300&q=80"
          />
        </div>
        <div class="mini">
          <img
            src="https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=300&q=80"
          />
        </div>
      </div>
      <div class="upload-actions">
        <a class="btn pink" href="../results/results.html"
          >View demo matches →</a
        >
      </div>
    </div>
  </body>
</html>
